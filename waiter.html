<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاشة استقبال طلبات الويتر</title>
    <style>
        body { font-family: Tahoma, Arial, sans-serif; background-color: #2c3e50; color: white; padding: 20px; margin: 0; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #34495e; padding-bottom: 15px; }
        .header-brand { display: flex; align-items: center; gap: 15px; }
        .header-logo { height: 50px; width: auto; border-radius: 8px; object-fit: contain; background: white; padding: 3px; }
        .overlay-logo { max-width: 140px; max-height: 140px; margin-bottom: 15px; border-radius: 15px; background: white; padding: 8px; }
        .badge { padding: 5px 12px; border-radius: 20px; font-size: 14px; }
        .online { background-color: #27ae60; }
        .offline { background-color: #c0392b; }
        #calls-container { margin-top: 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
        .call-card { background-color: #ecf0f1; color: #2c3e50; padding: 20px; border-radius: 10px; border-right: 8px solid #e74c3c; box-shadow: 0 4px 8px rgba(0,0,0,0.2); animation: fadeIn 0.4s; }
        .call-card h3 { margin: 0 0 10px 0; color: #e74c3c; font-size: 22px; }
        .done-btn { background-color: #27ae60; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; width: 100%; margin-top: 15px; font-size: 16px; }
        #start-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(44, 62, 80, 0.96); z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
        }
        #start-btn {
            background-color: #27ae60; color: white; border: none; padding: 20px 40px;
            font-size: 22px; border-radius: 12px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div id="start-overlay">
    <img src="logo.png" alt="لوجو المطعم" class="overlay-logo" onerror="this.style.display='none'">
    <h2>🔔 نظام استقبال طلبات الطاولات</h2>
    <p style="margin-bottom: 25px; color: #bdc3c7;">اضغط بالأسفل لتفعيل التنبيهات الصوتية وإبقاء الشاشة نشطة</p>
    <button id="start-btn" onclick="activateSystem()">🚀 بدء استقبال الطلبات</button>
</div>

<div class="header">
    <div class="header-brand">
        <img src="logo.png" alt="لوجو المطعم" class="header-logo" onerror="this.style.display='none'">
        <h2 style="margin: 0;">لوحة طلبات الطاولات</h2>
    </div>
    <span id="conn-status" class="badge offline">جاري الاتصال...</span>
</div>

<div id="calls-container"></div>

<script>
    const statusBadge = document.getElementById('conn-status');
    const container = document.getElementById('calls-container');
    const topic = 'restaurant/my_unique_shop_123/calls';

    let ws;
    let pingInterval;
    let audioCtx;

    async function activateSystem() {
        document.getElementById('start-overlay').style.display = 'none';
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') await audioCtx.resume();
        playBeep();

        try {
            if ('wakeLock' in navigator) {
                await navigator.wakeLock.request('screen');
            }
        } catch (err) {}
    }

    function playBeep() {
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const osc1 = audioCtx.createOscillator();
            const gain1 = audioCtx.createGain();
            osc1.type = 'sine';
            osc1.frequency.setValueAtTime(660, audioCtx.currentTime);
            gain1.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
            osc1.connect(gain1);
            gain1.connect(audioCtx.destination);
            osc1.start();
            osc1.stop(audioCtx.currentTime + 0.5);

            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();
            osc2.type = 'sine';
            osc2.frequency.setValueAtTime(520, audioCtx.currentTime + 0.3);
            gain2.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.0);
            osc2.connect(gain2);
            gain2.connect(audioCtx.destination);
            osc2.start(audioCtx.currentTime + 0.3);
            osc2.stop(audioCtx.currentTime + 1.0);
        } catch (e) {}
    }

    function encodeString(str) {
        const enc = new TextEncoder().encode(str);
        const res = new Uint8Array(2 + enc.length);
        res = (enc.length >> 8) & 0xff;
        res = enc.length & 0xff;
        res.set(enc, 2);
        return res;
    }

    function encodeLength(len) {
        const bytes = [];
        do {
            let digit = len % 128;
            len = Math.floor(len / 128);
            if (len > 0) digit |= 0x80;
            bytes.push(digit);
        } while (len > 0);
        return new Uint8Array(bytes);
    }

    function connectWaiter() {
        ws = new WebSocket('wss://broker.emqx.io:8084/mqtt', 'mqtt');
        ws.binaryType = 'arraybuffer';

        ws.onopen = function() {
            const clientId = 'wtr_' + Math.floor(Math.random() * 10000);
            const protocolName = encodeString('MQTT');
            const clientIdBytes = encodeString(clientId);
            const varHeader = new Uint8Array([...protocolName, 4, 2, 0, 60]);
            const remainingLen = encodeLength(varHeader.length + clientIdBytes.length);
            ws.send(new Uint8Array([0x10, ...remainingLen, ...varHeader, ...clientIdBytes]));
        };

        ws.onmessage = function(event) {
            const data = new Uint8Array(event.data);
            const packetType = data & 0xf0;

            if (packetType === 0x20 && data === 0x00) {
                const topicBytes = encodeString(topic);
                const payload = new Uint8Array([0x00, 0x01, ...topicBytes, 0x00]);
                const remainingLen = encodeLength(payload.length);
                ws.send(new Uint8Array([0x82, ...remainingLen, ...payload]));

                statusBadge.textContent = 'متصل وجاهز للاستقبال ✅';
                statusBadge.className = 'badge online';

                pingInterval = setInterval(() => {
                    if (ws.readyState === WebSocket.OPEN) {
                        ws.send(new Uint8Array([0xC0, 0x00]));
                    }
                }, 30000);
            }
            else if (packetType === 0x30) {
                let pos = 1;
                let mult = 1;
                let remLen = 0;
                let byte;
                do {
                    byte = data[pos++];
                    remLen += (byte & 127) * mult;
                    mult *= 128;
                } while ((byte & 128) !== 0);

                const topicLen = (data[pos] << 8) | data[pos + 1];
                pos += 2 + topicLen;

                const messageBytes = data.slice(pos);
                const messageStr = new TextDecoder().decode(messageBytes);

                try {
                    const callData = JSON.parse(messageStr);
                    addCallCard(callData);
                    playBeep();
                } catch (e) {}
            }
        };

        ws.onclose = function() {
            clearInterval(pingInterval);
            statusBadge.textContent = 'انقطع الاتصال، جاري المحاولة...';
            statusBadge.className = 'badge offline';
            setTimeout(connectWaiter, 3000);
        };
    }

    function addCallCard(data) {
        const card = document.createElement('div');
        card.className = 'call-card';
        card.innerHTML = `
            <h3>طاولة رقم ${data.table}</h3>
            <p><strong>الطلب:</strong> ${data.request}</p>
            <p><small>الوقت: ${data.time}</small></p>
            <button class="done-btn" onclick="this.parentElement.remove()">✔️ تم تلبية الطلب</button>
        `;
        container.prepend(card);
    }

    connectWaiter();
</script>

</body>
</html>
