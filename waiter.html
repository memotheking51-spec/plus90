<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاشة استقبال الطلبات - الويتر</title>
    <script src="https://unpkg.com"></script>
    <style>
        body { font-family: Tahoma, Arial, sans-serif; background: #222; color: white; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #444; padding-bottom: 15px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; margin-top: 20px; }
        .alert-card { background: #dc3545; padding: 20px; border-radius: 10px; text-align: center; animation: pulse 1.5s infinite; }
        .alert-card h2 { margin: 0 0 10px 0; font-size: 28px; }
        .alert-card p { font-size: 18px; margin: 5px 0; }
        .done-btn { background: white; color: #333; border: none; padding: 10px 20px; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 15px; width: 100%; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.85; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<div class="header">
    <h1>📋 طلبات الطاولات المباشرة</h1>
    <div id="connStatus">🔴 جاري الاتصال...</div>
</div>

<!-- زر لتفعيل الصوت لأن المتصفحات تمنع الصوت التلقائي قبل تفاعل المستخدم -->
<button onclick="enableAudio()" id="audioBtn" style="padding: 10px; margin-top: 10px; background: #ffc107; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">🔊 اضغط هنا لتفعيل التنبيه الصوتي</button>

<div class="grid" id="ordersContainer"></div>

<script>
    const brokerUrl = 'wss://broker.emqx.io:8084/mqtt';
    const topic = 'my_plus_ninety_123/calls'; // يجب أن يطابق نفس الاسم في صفحة العميل
    let audioEnabled = false;

    // صوت تنبيه بسيط مدمج (Beep)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep() {
        if (!audioEnabled) return;
        const oscillator = audioCtx.createOscillator();
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);
        oscillator.connect(audioCtx.destination);
        oscillator.start();
        oscillator.stop(audioCtx.currentTime + 0.3);
    }

    function enableAudio() {
        audioCtx.resume();
        audioEnabled = true;
        document.getElementById('audioBtn').style.display = 'none';
    }

    const client = mqtt.connect(brokerUrl, {
        clientId: 'waiter_' + Math.random().toString(16).substr(2, 8),
        clean: true
    });

    client.on('connect', () => {
        document.getElementById('connStatus').innerText = '🟢 متصل بالنظام';
        client.subscribe(topic, { qos: 1 });
    });

    client.on('message', (receivedTopic, message) => {
        try {
            const data = JSON.parse(message.toString());
            addOrderCard(data);
            playBeep();
        } catch (e) {
            console.error('خطأ في قراءة الرسالة:', e);
        }
    });

    function addOrderCard(data) {
        const container = document.getElementById('ordersContainer');
        const card = document.createElement('div');
        card.className = 'alert-card';
        card.innerHTML = `
            <h2>طاولة ${data.table}</h2>
            <p><strong>${data.action}</strong></p>
            <p style="font-size: 14px;">الوقت: ${data.time}</p>
            <button class="done-btn" onclick="this.parentElement.remove()">✔️ تم الاستجابة</button>
        `;
        container.prepend(card);
    }
</script>

</body>
</html>
