<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLUSNINET - خدمة الطاولة</title>
    <style>
        body { 
            font-family: Tahoma, Arial, sans-serif; 
            text-align: center; 
            background-color: #121212; 
            color: white; 
            padding: 15px; 
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        /* تصغير عرض البطاقة وحوافها الداخلية */
        .card { 
            background: #1e1e1e; 
            width: 100%;
            max-width: 280px; 
            padding: 18px 16px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
            border: 1px solid #333; 
        }
        /* تصغير حجم اللوجو */
        .logo { 
            width: 65px; 
            height: 65px; 
            margin-bottom: 10px; 
            border-radius: 10px; 
            background: white; 
            padding: 3px; 
            object-fit: contain; 
        }
        /* تصغير حجم عنوان الطاولة */
        h2 { 
            color: #ffffff; 
            font-size: 18px;
            margin-bottom: 8px; 
            margin-top: 0; 
        }
        /* تصغير شريط الحالة */
        .status { 
            font-size: 12px; 
            margin-bottom: 14px; 
            padding: 6px; 
            border-radius: 6px; 
            font-weight: bold; 
        }
        .connected { background-color: rgba(39, 174, 96, 0.2); color: #2ecc71; border: 1px solid #27ae60; }
        .disconnected { background-color: rgba(192, 57, 43, 0.2); color: #e74c3c; border: 1px solid #c0392b; }
        
        /* تصغير الأزرار والخط بداخلها */
        button { 
            width: 100%; 
            padding: 10px; 
            margin: 6px 0; 
            font-size: 14px; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            color: white; 
            transition: 0.2s; 
            font-weight: bold; 
        }
        button:active { transform: scale(0.97); }
        .btn-waiter { background-color: #007bff; }
        .btn-bill { background-color: #28a745; }
        .btn-water { background-color: #17a2b8; }
        button:disabled { background-color: #444; color: #888; cursor: not-allowed; }
        #msg { margin-top: 10px; font-size: 13px; font-weight: bold; color: #2ecc71; }
    </style>
</head>
<body>

<div class="card">
    <img src="logo.png" alt="PLUSNINET" class="logo" onerror="this.style.display='none'">
    <h2 id="table-title">طاولة رقم 1</h2>
    <div id="status" class="status disconnected">جاري الاتصال...</div>

    <button id="btn1" class="btn-waiter" onclick="sendCall('استدعاء ويتر')" disabled>🔔 استدعاء الويتر</button>
    <button id="btn2" class="btn-bill" onclick="sendCall('طلب الحساب')" disabled>💳 طلب الحساب</button>
    <button id="btn3" class="btn-water" onclick="sendCall('طلب مياه')" disabled>💧 طلب مياه</button>

    <div id="msg"></div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const tableNumber = urlParams.get('table') || '1';
    document.getElementById('table-title').textContent = `طاولة رقم ${tableNumber}`;

    const statusDiv = document.getElementById('status');
    const buttons = document.querySelectorAll('button');
    const topic = 'restaurant/plusninet_shop_99/calls';
    
    const brokers = [
        'wss://broker.emqx.io:8084/mqtt',
        'wss://://hivemq.com'
    ];
    let brokerIndex = 0;
    let ws;
    let pingInterval;

    function encodeString(str) {
        const enc = new TextEncoder().encode(str);
        const res = new Uint8Array(2 + enc.length);
        res[0] = (enc.length >> 8) & 0xff;
        res[1] = enc.length & 0xff;
        res.set(enc, 2);
        return res;
    }

    function encodeLength(len) {
        const bytes = [];
        do {
            let digit = len % 128;
            len = Math.floor(len / 128);
            if (len > 0) digit |= 0x80;
            bytes.push(digit);
        } while (len > 0);
        return new Uint8Array(bytes);
    }

    function connectMQTT() {
        statusDiv.textContent = 'جاري الاتصال بالنظام...';
        statusDiv.className = 'status disconnected';
        buttons.forEach(btn => btn.disabled = true);

        ws = new WebSocket(brokers[brokerIndex], 'mqtt');
        ws.binaryType = 'arraybuffer';

        ws.onopen = function() {
            const clientId = 'tbl_' + tableNumber + '_' + Math.floor(Math.random() * 100000);
            const protocolName = encodeString('MQTT');
            const clientIdBytes = encodeString(clientId);
            const varHeader = new Uint8Array([...protocolName, 4, 2, 0, 60]);
            const remainingLen = encodeLength(varHeader.length + clientIdBytes.length);
            ws.send(new Uint8Array([0x10, ...remainingLen, ...varHeader, ...clientIdBytes]));
        };

        ws.onmessage = function(event) {
            const data = new Uint8Array(event.data);
            if (data[0] === 0x20 && data[3] === 0x00) {
                statusDiv.textContent = 'متصل بالنظام وجاهز ✅';
                statusDiv.className = 'status connected';
                buttons.forEach(btn => btn.disabled = false);

                clearInterval(pingInterval);
                pingInterval = setInterval(() => {
                    if (ws.readyState === WebSocket.OPEN) {
                        ws.send(new Uint8Array([0xC0, 0x00]));
                    }
                }, 25000);
            }
        };

        ws.onclose = function() {
            clearInterval(pingInterval);
            statusDiv.textContent = 'جاري إعادة الاتصال...';
            statusDiv.className = 'status disconnected';
            buttons.forEach(btn => btn.disabled = true);
            brokerIndex = (brokerIndex + 1) % brokers.length;
            setTimeout(connectMQTT, 2500);
        };
    }

    window.sendCall = function(requestType) {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        buttons.forEach(btn => btn.disabled = true);

        const payloadObj = JSON.stringify({
            table: tableNumber,
            request: requestType,
            time: new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' })
        });

        const topicBytes = encodeString(topic);
        const payloadBytes = new TextEncoder().encode(payloadObj);
        const remainingLen = encodeLength(topicBytes.length + payloadBytes.length);
        ws.send(new Uint8Array([0x30, ...remainingLen, ...topicBytes, ...payloadBytes]));

        const msgDiv = document.getElementById('msg');
        msgDiv.textContent = `✅ تم إرسال "${requestType}" للويتر!`;
        setTimeout(() => {
            msgDiv.textContent = '';
            buttons.forEach(btn => btn.disabled = false);
        }, 4000);
    };

    connectMQTT();
</script>

</body>
</html>
