<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استدعاء الويتر</title>
    <script src="https://unpkg.com"></script>
    <style>
        body { font-family: Tahoma, Arial, sans-serif; text-align: center; background: #f4f6f9; padding: 20px; }
        .card { background: white; max-width: 400px; margin: 40px auto; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #333; margin-bottom: 5px; }
        .table-num { font-size: 24px; color: #007bff; font-weight: bold; margin-bottom: 25px; }
        button { width: 100%; padding: 15px; margin: 10px 0; font-size: 18px; border: none; border-radius: 10px; cursor: pointer; color: white; transition: 0.3s; }
        .btn-call { background: #28a745; }
        .btn-bill { background: #17a2b8; }
        .btn-water { background: #6c757d; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        #status { margin-top: 20px; font-weight: bold; color: #555; }
    </style>
</head>
<body>

<div class="card">
    <h1>أهلاً بك</h1>
    <div class="table-num">طاولة رقم: <span id="tableDisplay">--</span></div>

    <button class="btn-call" onclick="sendRequest('استدعاء الويتر')">🔔 استدعاء الويتر</button>
    <button class="btn-bill" onclick="sendRequest('طلب الفاتورة')">🧾 طلب الحساب</button>
    <button class="btn-water" onclick="sendRequest('طلب مياه')">💧 طلب مياه</button>

    <div id="status">جاري الاتصال بالنظام...</div>
</div>

<script>
    // 1. استخراج رقم الطاولة من الرابط (?table=5)
    const urlParams = new URLSearchParams(window.location.search);
    const tableNumber = urlParams.get('table') || 'غير محدد';
    document.getElementById('tableDisplay').innerText = tableNumber;

    // 2. إعدادات اتصال MQTT (استخدام وسيط عام مجاني للتجربة)
    // ملاحظة: في الإنتاج يفضل استخدام وسيط خاص مثل EMQX أو HiveMQ Cloud
    const brokerUrl = 'wss://broker.emqx.io:8084/mqtt';
    const topic = 'my_restaurant_unique_123/calls'; // غيّر الاسم ليكون فريداً لمطعمك

    const client = mqtt.connect(brokerUrl, {
        clientId: 'client_' + Math.random().toString(16).substr(2, 8),
        clean: true,
        connectTimeout: 4000
    });

    const statusDiv = document.getElementById('status');
    const buttons = document.querySelectorAll('button');
    buttons.forEach(btn => btn.disabled = true);

    client.on('connect', () => {
        statusDiv.innerText = '✅ جاهز لخدمتك';
        statusDiv.style.color = 'green';
        buttons.forEach(btn => btn.disabled = false);
    });

    client.on('error', (err) => {
        statusDiv.innerText = '❌ خطأ في الاتصال، يرجى تحديث الصفحة';
        statusDiv.style.color = 'red';
    });

    // 3. دالة إرسال الطلب
    function sendRequest(actionType) {
        if (!client.connected) {
            alert('لا يوجد اتصال بالخادم حالياً');
            return;
        }

        const payload = JSON.stringify({
            table: tableNumber,
            action: actionType,
            time: new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' })
        });

        // إرسال الرسالة مع ضمان الوصول مرة واحدة (QoS 1)
        client.publish(topic, payload, { qos: 1 }, (error) => {
            if (error) {
                statusDiv.innerText = '❌ فشل الإرسال، حاول مرة أخرى';
            } else {
                statusDiv.innerText = `✔️ تم إرسال (${actionType}) بنجاح!`;
                statusDiv.style.color = '#007bff';
                
                // تعطيل الأزرار 15 ثانية لمنع الإرسال المتكرر بالخطأ
                buttons.forEach(btn => btn.disabled = true);
                setTimeout(() => {
                    buttons.forEach(btn => btn.disabled = false);
                    statusDiv.innerText = '✅ جاهز لخدمتك';
                    statusDiv.style.color = 'green';
                }, 15000);
            }
        });
    }
</script>

</body>
</html>
