<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خدمة الطاولة</title>
    <style>
        body { font-family: Tahoma, Arial, sans-serif; text-align: center; background-color: #f4f7f6; padding: 20px; }
        .card { background: white; max-width: 400px; margin: auto; padding: 30px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .logo { max-width: 120px; max-height: 120px; margin-bottom: 15px; border-radius: 10px; object-fit: contain; }
        h2 { color: #333; margin-bottom: 5px; margin-top: 0; }
        .status { font-size: 14px; margin-bottom: 20px; padding: 10px; border-radius: 5px; }
        .connected { background-color: #d4edda; color: #155724; }
        .disconnected { background-color: #f8d7da; color: #721c24; }
        button { width: 100%; padding: 15px; margin: 10px 0; font-size: 18px; border: none; border-radius: 10px; cursor: pointer; color: white; transition: 0.3s; }
        .btn-waiter { background-color: #007bff; }
        .btn-bill { background-color: #28a745; }
        .btn-water { background-color: #17a2b8; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        #msg { margin-top: 15px; font-weight: bold; color: #007bff; }
    </style>
</head>
<body>

<div class="card">
    <!-- صورة اللوجو -->
    <img src="logo.png" alt="لوجو المطعم" class="logo" onerror="this.style.display='none'">
    
    <h2 id="table-title">طاولة رقم 1</h2>
    <div id="status" class="status disconnected">جاري الاتصال المباشر...</div>

    <button id="btn1" class="btn-waiter" onclick="sendCall('استدعاء ويتر')" disabled>🔔 استدعاء الويتر</button>
    <button id="btn2" class="btn-bill" onclick="sendCall('طلب الحساب')" disabled>💳 طلب الحساب</button>
    <button id="btn3" class="btn-water" onclick="sendCall('طلب مياه')" disabled>💧 طلب مياه</button>

    <div id="msg"></div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const tableNumber = urlParams.get('table') || '1';
    document.getElementById('table-title').textContent = `طاولة رقم ${tableNumber}`;

    const statusDiv = document.getElementById('status');
    const buttons = document.querySelectorAll('button');
    const topic = 'restaurant/my_unique_shop_123/calls';
    
    let ws;
    let pingInterval;

    function encodeString(str) {
        const enc = new TextEncoder().encode(str);
        const res = new Uint8Array(2 + enc.length);
        res = (enc.length >> 8) & 0xff;
        res = enc.length & 0xff;
        res.set(enc, 2);
        return res;
    }

    function encodeLength(len) {
        const bytes = [];
        do {
            let digit = len % 128;
            len = Math.floor(len / 128);
            if (len > 0) digit |= 0x80;
            bytes.push(digit);
        } while (len > 0);
        return new Uint8Array(bytes);
    }

    function connectMQTT() {
        statusDiv.textContent = 'جاري الاتصال بخادم المطعم...';
        statusDiv.className = 'status disconnected';
        buttons.forEach(btn => btn.disabled = true);

        ws = new WebSocket('wss://broker.emqx.io:8084/mqtt', 'mqtt');
        ws.binaryType = 'arraybuffer';

        ws.onopen = function() {
            const clientId = 'tbl_' + tableNumber + '_' + Math.floor(Math.random() * 10000);
            const protocolName = encodeString('MQTT');
            const clientIdBytes = encodeString(clientId);
            const varHeader = new Uint8Array([...protocolName, 4, 2, 0, 60]);
            const remainingLen = encodeLength(varHeader.length + clientIdBytes.length);
            ws.send(new Uint8Array([0x10, ...remainingLen, ...varHeader, ...clientIdBytes]));
        };

        ws.onmessage = function(event) {
            const data = new Uint8Array(event.data);
            if (data === 0x20 && data === 0x00) {
                statusDiv.textContent = 'متصل بالنظام وجاهز ✅';
                statusDiv.className = 'status connected';
                buttons.forEach(btn => btn.disabled = false);

                pingInterval = setInterval(() => {
                    if (ws.readyState === WebSocket.OPEN) {
                        ws.send(new Uint8Array([0xC0, 0x00]));
                    }
                }, 30000);
            }
        };

        ws.onerror = function() {
            statusDiv.textContent = 'تعذر الوصول للخادم، جاري المحاولة...';
        };

        ws.onclose = function() {
            clearInterval(pingInterval);
            statusDiv.textContent = 'انقطع الاتصال، جاري إعادة المحاولة...';
            statusDiv.className = 'status disconnected';
            buttons.forEach(btn => btn.disabled = true);
            setTimeout(connectMQTT, 3000);
        };
    }

    window.sendCall = function(requestType) {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        buttons.forEach(btn => btn.disabled = true);

        const payloadObj = JSON.stringify({
            table: tableNumber,
            request: requestType,
            time: new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' })
        });

        const topicBytes = encodeString(topic);
        const payloadBytes = new TextEncoder().encode(payloadObj);
        const remainingLen = encodeLength(topicBytes.length + payloadBytes.length);
        ws.send(new Uint8Array([0x30, ...remainingLen, ...topicBytes, ...payloadBytes]));

        const msgDiv = document.getElementById('msg');
        msgDiv.textContent = `✅ تم إرسال "${requestType}" للويتر!`;
        setTimeout(() => {
            msgDiv.textContent = '';
            buttons.forEach(btn => btn.disabled = false);
        }, 4000);
    };

    connectMQTT();
</script>

</body>
</html>
